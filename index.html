  <style>:root{color-scheme:light dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC",sans-serif;background:#f5f3ed;color:#1c2229}*{box-sizing:border-box}body{margin:0}main{width:min(100% - 32px,760px);margin:0 auto;padding:32px 0 64px}nav{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:28px}a{color:#8a641b;text-underline-offset:3px}article+article{border-top:1px solid #cbc6bb;margin-top:56px;padding-top:48px}.language{color:#8a641b;font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{font-family:Georgia,"Songti SC",serif;font-size:clamp(2rem,8vw,3rem);line-height:1.1;margin:.3em 0}h2{font-size:1.25rem;margin:2em 0 .6em}p,li{font-size:1rem;line-height:1.75}li+li{margin-top:.35em}dl{background:#ebe7dd;border-radius:14px;padding:14px 18px;margin:24px 0}dl div{display:grid;grid-template-columns:minmax(110px,1fr) 2fr;gap:12px;padding:5px 0}dt{color:#666}dd{margin:0;font-weight:650}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{display:block;padding:22px;border:1px solid #cbc6bb;border-radius:16px;text-decoration:none;color:inherit;background:#fff}.card strong{display:block;font-size:1.3rem;margin-bottom:8px}.card span{color:#666}@media(prefers-color-scheme:dark){:root{background:#090b0e;color:#f2efe7}a{color:#e3bd70}article+article{border-color:#30363e}dl{background:#15191f}.card{background:#11151b;border-color:#30363e}.card span,dt{color:#a7aeb8}}@media(max-width:480px){main{width:min(100% - 28px,760px);padding-top:22px}dl div{display:block}dt{margin-bottom:2px}}</style>
